server {
  listen 8080;
  server_name _;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
